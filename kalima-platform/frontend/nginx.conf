# Docker Nginx Config (no SSL)

# Maintenance bypass: this IP (real client IP via X-Forwarded-For behind the
# Coolify proxy) skips the 503 maintenance page, so we can test during maintenance.
map $http_x_forwarded_for $maintenance_bypass {
    default 0;
    "~(^|[ ,])41\.47\.108\.153([ ,]|$)" 1;
}

server {
    listen 80;
    server_name kalima-edu.com;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # إعدادات صفحة الصيانة (Maintenance Mode)
    # ==========================================
    error_page 503 @maintenance;

    location @maintenance {
        rewrite ^(.*)$ /maintenance.html break;
    }

    # السماح بظهور ملف الصيانة نفسه
    location = /maintenance.html {
        allow all;
    }
    # ==========================================

    # API location
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;
        proxy_request_buffering off;
        client_max_body_size 1G;
    }

    # Socket.IO (WebSocket) location
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Uploads location - proxy to backend
    location ^~ /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite/pdfjs emits module workers as .mjs; older nginx mime maps serve them as octet-stream.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:css|js|wasm|webp|avif|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.html;
    }

    # Frontend routes
    location / {
        # Maintenance: show the 503 page to everyone EXCEPT the bypass IP above.
        set $under_maintenance 0;
        if (-f /usr/share/nginx/html/maintenance.flag) {
            set $under_maintenance 1;
        }
        if ($maintenance_bypass) {
            set $under_maintenance 0;
        }
        if ($under_maintenance) {
            return 503;
        }

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}