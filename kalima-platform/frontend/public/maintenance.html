      @keyframes spin-one {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(359deg);
        }
      }
      .spin-one {
        animation: spin-one 2s infinite linear;
      }
      @keyframes spin-two {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(-359deg);
        }
      }
      .spin-two {
        animation: spin-two 2.5s infinite linear;
      }

      /* ---------------- Typography & Typewriter ---------------- */
      h1 {
        font-size: 44px;
        font-weight: 900;
        margin-bottom: 25px;
        color: #0b2248;
        line-height: 1.4;
      }
      h1 span {
        color: #f3510f;
      }
      .cursor {
        display: inline-block;
        width: 4px;
        height: 1em;
        background-color: #f3510f;
        vertical-align: middle;
        animation: blink 0.8s infinite;
        margin-right: 5px;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      p {
        font-size: 26px;
        font-weight: 700;
        color: #666;
        margin-bottom: 20px;
        line-height: 1.8;
      }
      p.sub-text {
        font-size: 20px;
        color: #666;
        margin-top: 15px;
      }

      /* ---------------- Responsive (Mobile Fixes) ---------------- */
      @media (max-width: 768px) {
        .box {
          padding: 40px 20px;
        }
        .animation {
          transform: scale(0.9);
          margin-bottom: 30px;
        }
        h1 {
          font-size: 32px;
          margin-bottom: 15px;
        }
        p {
          font-size: 18px;
          line-height: 1.6;
        }
        p.sub-text {
          font-size: 16px;
        }
      }

  <body>
    <div class="container">
      <div class="box">
        <!-- التروس المتحركة -->
        <div class="animation">
          <div class="one spin-one"></div>
          <div class="two spin-two"></div>
          <div class="three spin-one"></div>
        </div>

        <!-- تأثير الآلة الكاتبة -->
        <h1><span id="typewriter-ar"></span><span class="cursor"></span></h1>

        <!-- بناءً على الصورة، قمت بإعادة الجملة التي طلبتها -->
        <p>نقوم بإجراء بعض التحديثات لتحسين الموقع.</p>
        <p class="sub-text">سنعود إليكم خلال 24 ساعة.</p>
      </div>
    </div>

    <script>
      /* ---------------- Typewriter Logic ---------------- */
      const textAr = 'منصة كلمة تحت الصيانة';
      let iAr = 0;

      function typeWriterAr() {
        if (iAr < textAr.length) {
          document.getElementById('typewriter-ar').innerHTML += textAr.charAt(iAr);
          iAr++;
          setTimeout(typeWriterAr, 100);
        } else {
          document.getElementById('typewriter-ar').innerHTML = 'منصة كلمة <br><span>تحت الصيانة</span>';
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(typeWriterAr, 500);
      });
    </script>
  </body>
